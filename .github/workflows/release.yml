# Builds, signs and publishes a new version whenever the app's code changes on main.
# The app checks this repo's latest release and offers it to everyone with one click.
name: Release
on:
  push:
    branches: [main]
    paths: [Sources/**, Resources/**, Info.plist, build.sh]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Load the signing certificate
        env:
          P12: ${{ secrets.SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/sign.keychain-db
          echo "$P12" | base64 --decode > $RUNNER_TEMP/sign.p12
          security create-keychain -p ci $KC
          security set-keychain-settings $KC
          security unlock-keychain -p ci $KC
          security import $RUNNER_TEMP/sign.p12 -k $KC -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci $KC >/dev/null
          security list-keychains -d user -s $KC login.keychain
          openssl pkcs12 -in $RUNNER_TEMP/sign.p12 -nokeys -passin env:P12_PASSWORD -legacy -out $RUNNER_TEMP/cert.pem 2>/dev/null \
            || openssl pkcs12 -in $RUNNER_TEMP/sign.p12 -nokeys -passin env:P12_PASSWORD -out $RUNNER_TEMP/cert.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain $RUNNER_TEMP/cert.pem
          security find-identity -v -p codesigning
      - name: Build
        run: ./build.sh
      - name: Check the signature
        run: codesign -dr- build/SttarkGrammar.app 2>&1 | grep "certificate leaf"
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/SttarkGrammar.app/Contents/Info.plist)
          ditto -c -k --keepParent build/SttarkGrammar.app SttarkGrammar.zip
          gh release create "v$V" SttarkGrammar.zip --title "Sttark Grammar $V" --latest \
            --notes "$(git log -1 --format=%s)"$'\n\n'"Download SttarkGrammar.zip below, or click Update in the app's menu."
